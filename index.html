<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach Timer">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Coach Timer</title>

  <!--
    PWA OFFLINE STRATEGY
    ====================
    All three external PWA dependencies (manifest.json, sw.js, icon-192.png)
    are generated at runtime so this single HTML file works offline once cached.

    1. Manifest  → injected as a data: URI link tag (no manifest.json file needed)
    2. Icon      → drawn on a <canvas> then base64'd into the manifest + apple-touch-icon
    3. Service Worker → written as a Blob URL, registered immediately
       • The SW caches THIS file's URL on install
       • fetch handler returns the cached copy when offline
  -->

  <style>
    :root {
      --bg: #0a0a0f;
      --card: #13131a;
      --card-active: #16161f;
      --border: #22222e;
      --accent: #4af0a0;
      --accent-dim: rgba(74, 240, 160, 0.12);
      --text: #f0f0f8;
      --text-dim: #6b6b88;
      --text-label: #9898b8;
      --font-mono: 'SF Mono', 'Fira Mono', 'Consolas', monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
    }

    .watch-card[data-color="0"] { --w-accent: #4af0a0; --w-dim: rgba(74,240,160,0.12); }
    .watch-card[data-color="1"] { --w-accent: #4ab4f0; --w-dim: rgba(74,180,240,0.12); }
    .watch-card[data-color="2"] { --w-accent: #f0e04a; --w-dim: rgba(240,224,74,0.12); }
    .watch-card[data-color="3"] { --w-accent: #f04a7a; --w-dim: rgba(240,74,122,0.12); }
    .watch-card[data-color="4"] { --w-accent: #c04af0; --w-dim: rgba(192,74,240,0.12); }
    .watch-card[data-color="5"] { --w-accent: #f0944a; --w-dim: rgba(240,148,74,0.12); }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
    }

    .app-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .header-actions { display: flex; gap: 8px; }

    .btn-global {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-global:active { opacity: 0.7; transform: scale(0.97); }
    .btn-global.start-all { border-color: var(--accent); color: var(--accent); }
    .btn-global.start-all.running { background: var(--accent-dim); }
    .btn-global.reset-all { border-color: var(--border); color: var(--text-dim); }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      align-content: start;
    }

    @media (min-width: 600px) {
      .grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    .watch-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: border-color 0.2s;
      user-select: none;
    }

    .watch-card.running {
      border-color: color-mix(in srgb, var(--w-accent) 35%, transparent);
    }

    .watch-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-label);
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-family: var(--font-ui);
      cursor: text;
    }

    .watch-name::placeholder { color: var(--text-dim); }
    .watch-name:focus { color: var(--text); }

    .watch-time {
      font-family: var(--font-mono);
      font-size: clamp(22px, 6.5vw, 32px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-align: center;
      line-height: 1;
    }

    .watch-card.running .watch-time { color: var(--w-accent); }

    .watch-laps {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 14px;
      min-height: 42px;
      color: var(--text-dim);
      text-align: center;
    }

    .watch-laps div:first-child { color: var(--text-label); }

    .watch-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 6px;
    }

    .btn-watch {
      padding: 9px 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.12s;
      text-transform: uppercase;
    }

    .btn-watch:active { transform: scale(0.95); opacity: 0.8; }

    .btn-start {
      color: var(--w-accent);
      border-color: color-mix(in srgb, var(--w-accent) 35%, transparent);
      grid-column: 1;
      grid-row: 1;
    }

    .btn-start:hover { background: var(--w-dim); }

    .btn-reset {
      color: var(--text-dim);
      border-color: var(--border);
      grid-column: 1;
      grid-row: 2;
    }

    .btn-reset:hover { background: rgba(255,255,255,0.04); color: var(--text); }

    .btn-lap {
      color: var(--w-accent);
      border-color: color-mix(in srgb, var(--w-accent) 35%, transparent);
      grid-column: 2;
      grid-row: 1 / span 2;
      font-size: 14px;
      opacity: 0.85;
    }

    .btn-lap:hover { background: var(--w-dim); opacity: 1; }

    #install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--accent-dim);
      border-bottom: 1px solid rgba(74, 240, 160, 0.2);
      font-size: 13px;
      color: var(--accent);
      gap: 10px;
    }

    #install-banner button {
      padding: 6px 14px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    #install-banner .dismiss {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      margin-left: 6px;
    }

    .status-bar {
      padding: 6px 16px;
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div id="install-banner">
  <span>📲 Add to Home Screen for best experience</span>
  <div>
    <button id="install-btn">Install</button>
    <button class="dismiss" id="dismiss-banner">✕</button>
  </div>
</div>

<header>
  <span class="app-title">Coach Timer</span>
  <div class="header-actions">
    <button class="btn-global reset-all" id="reset-all-btn">Reset All</button>
    <button class="btn-global start-all" id="start-all-btn">Start All</button>
  </div>
</header>

<div class="grid" id="watch-grid"></div>

<div class="status-bar" id="status-bar">Tap a name to edit · Start to begin</div>

<script>
// ─── PWA Bootstrap ────────────────────────────────────────────────────────────
// Everything is generated at runtime so this single HTML file is self-contained.
// No manifest.json, sw.js, or icon files needed.

(function bootstrapPWA() {

  // 1. Draw the app icon on a canvas
  const canvas = document.createElement('canvas');
  canvas.width = 192; canvas.height = 192;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#0a0a0f';
  // Rounded rect polyfill for older WebKit
  const r = 40;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(192 - r, 0);
  ctx.quadraticCurveTo(192, 0, 192, r);
  ctx.lineTo(192, 192 - r);
  ctx.quadraticCurveTo(192, 192, 192 - r, 192);
  ctx.lineTo(r, 192);
  ctx.quadraticCurveTo(0, 192, 0, 192 - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Outer ring
  ctx.strokeStyle = '#4af0a0';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(96, 96, 70, 0, Math.PI * 2);
  ctx.stroke();

  // Tick marks
  ctx.strokeStyle = '#4af0a0';
  ctx.lineWidth = 3;
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const inner = i % 3 === 0 ? 56 : 60;
    ctx.beginPath();
    ctx.moveTo(96 + Math.cos(angle) * inner, 96 + Math.sin(angle) * inner);
    ctx.lineTo(96 + Math.cos(angle) * 68, 96 + Math.sin(angle) * 68);
    ctx.stroke();
  }

  // Hour hand
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(96, 96);
  ctx.lineTo(96, 44);
  ctx.stroke();

  // Minute hand (accent color)
  ctx.strokeStyle = '#4af0a0';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(96, 96);
  ctx.lineTo(134, 96);
  ctx.stroke();

  // Center dot
  ctx.fillStyle = '#4af0a0';
  ctx.beginPath();
  ctx.arc(96, 96, 5, 0, Math.PI * 2);
  ctx.fill();

  const iconDataURL = canvas.toDataURL('image/png');

  // 2. Inject apple-touch-icon
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = iconDataURL;
  document.head.appendChild(appleIcon);

  // 3. Build and inject the Web App Manifest as a data URI
  const manifest = {
    name: 'Coach Timer',
    short_name: 'Coach Timer',
    description: 'Multi-stopwatch timer for coaches',
    start_url: location.pathname + location.search,
    display: 'standalone',
    background_color: '#0a0a0f',
    theme_color: '#0a0a0f',
    orientation: 'portrait-primary',
    icons: [
      { src: iconDataURL, sizes: '192x192', type: 'image/png', purpose: 'any maskable' }
    ]
  };

  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = manifestURL;
  document.head.appendChild(manifestLink);

  // 4. Register a Blob-URL Service Worker that caches this page for offline use
  if ('serviceWorker' in navigator) {
    const CACHE_NAME = 'coach-timer-v2';
    // The SW caches the page URL (without hash) so it loads offline
    const PAGE_URL = location.origin + location.pathname + location.search;

    const swSource = `
const CACHE = '${CACHE_NAME}';
const PAGE  = '${PAGE_URL}';

self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE).then(cache => cache.add(PAGE))
  );
  self.skipWaiting();
});

self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    )
  );
  self.clients.claim();
});

self.addEventListener('fetch', event => {
  // Only handle same-origin navigations / the cached page
  const url = new URL(event.request.url);
  if (url.origin !== self.location.origin) return;

  event.respondWith(
    fetch(event.request)
      .then(response => {
        // Update cache with fresh copy when online
        const clone = response.clone();
        caches.open(CACHE).then(cache => cache.put(PAGE, clone));
        return response;
      })
      .catch(() => caches.match(PAGE))   // offline fallback
  );
});
`;

    const swBlob = new Blob([swSource], { type: 'application/javascript' });
    const swURL  = URL.createObjectURL(swBlob);

    navigator.serviceWorker.register(swURL, { scope: '/' })
      .then(reg => {
        console.log('[Coach Timer] SW registered, scope:', reg.scope);
      })
      .catch(err => {
        // Blob SW registration can fail in some browsers (e.g. Firefox) —
        // the app still works online; offline just won't cache.
        console.warn('[Coach Timer] SW registration failed:', err);
      });
  }

})();

// ─── State ────────────────────────────────────────────────────────────────────
const WATCH_COUNT = 6;
const watches = [];
let deferredInstall = null;
let wakeLock = null;

const DEFAULT_NAMES = ['Watch 1','Watch 2','Watch 3','Watch 4','Watch 5','Watch 6'];

// ─── Stopwatch class ──────────────────────────────────────────────────────────
class Stopwatch {
  constructor(id) {
    this.id = id;
    this.elapsed   = 0;
    this.startedAt = null;
    this.running   = false;
    this.lapCount  = 0;
    this.laps      = [];
  }

  start() {
    if (this.running) return;
    this.startedAt = Date.now();
    this.running = true;
  }

  pause() {
    if (!this.running) return;
    this.elapsed += Date.now() - this.startedAt;
    this.startedAt = null;
    this.running = false;
  }

  lap(record) {
    if (record) {
      this.laps.push(this.getMs());
      if (this.laps.length > 100) this.laps.shift();
    }
    if (this.running) this.startedAt = Date.now();
    this.elapsed = 0;
    this.lapCount++;
  }

  reset() {
    this.elapsed   = 0;
    this.startedAt = null;
    this.running   = false;
    this.lapCount  = 0;
    this.laps      = [];
  }

  getMs() {
    return this.running
      ? this.elapsed + (Date.now() - this.startedAt)
      : this.elapsed;
  }
}

// ─── Format ───────────────────────────────────────────────────────────────────
function fmt(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const tenth = Math.floor((ms % 1000) / 100);
  if (h > 0) {
    return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${tenth}`;
}

// ─── Build DOM ────────────────────────────────────────────────────────────────
const grid = document.getElementById('watch-grid');

for (let i = 0; i < WATCH_COUNT; i++) {
  const sw = new Stopwatch(i);
  watches.push(sw);

  const card = document.createElement('div');
  card.className = 'watch-card';
  card.id = `card-${i}`;
  card.dataset.color = i;
  card.innerHTML = `
    <input class="watch-name" id="name-${i}" type="text"
           placeholder="${DEFAULT_NAMES[i]}" value="" maxlength="14"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="watch-time" id="time-${i}">00:00.0</div>
    <div class="watch-laps" id="laps-${i}"></div>
    <div class="watch-btns">
      <button class="btn-watch btn-start" id="start-${i}">Start</button>
      <button class="btn-watch btn-reset" id="reset-${i}">Reset</button>
      <button class="btn-watch btn-lap"   id="lap-${i}">Lap</button>
    </div>
  `;
  grid.appendChild(card);

  document.getElementById(`start-${i}`).addEventListener('click', () => toggleWatch(i));
  document.getElementById(`lap-${i}`  ).addEventListener('click', () => lapWatch(i));
  document.getElementById(`reset-${i}`).addEventListener('click', () => resetWatch(i));
}

// ─── Watch controls ───────────────────────────────────────────────────────────
function toggleWatch(i) {
  const sw = watches[i];
  sw.running ? sw.pause() : sw.start();
  updateCard(i);
  updateMasterBtn();
  updateWakeLock();
}

function lapWatch(i) {
  const sw = watches[i];
  const wasRunning = sw.running;
  if (!wasRunning) sw.start();
  sw.lap(wasRunning);   // first press just starts the timer; later presses record the lap
  updateCard(i);
  if (navigator.vibrate) navigator.vibrate([40, 30, 40]);

  const timeEl = document.getElementById(`time-${i}`);
  timeEl.style.transition = 'none';
  timeEl.style.opacity = '0.3';
  requestAnimationFrame(() => {
    timeEl.style.transition = 'opacity 0.25s';
    timeEl.style.opacity = '1';
  });
}

function resetWatch(i) {
  watches[i].reset();
  updateCard(i);
  updateMasterBtn();
  updateWakeLock();
}

// ─── Global controls ──────────────────────────────────────────────────────────
document.getElementById('start-all-btn').addEventListener('click', () => {
  const anyRunning = watches.some(w => w.running);
  watches.forEach((w, i) => { anyRunning ? w.pause() : w.start(); updateCard(i); });
  updateMasterBtn();
  updateWakeLock();
});

document.getElementById('reset-all-btn').addEventListener('click', () => {
  watches.forEach((w, i) => { w.reset(); updateCard(i); });
  updateMasterBtn();
  updateWakeLock();
});

function updateMasterBtn() {
  const anyRunning = watches.some(w => w.running);
  const btn = document.getElementById('start-all-btn');
  btn.textContent = anyRunning ? 'Pause All' : 'Start All';
  btn.classList.toggle('running', anyRunning);
}

// ─── Card state ───────────────────────────────────────────────────────────────
function updateCard(i) {
  const sw  = watches[i];
  const card = document.getElementById(`card-${i}`);
  const startBtn = document.getElementById(`start-${i}`);
  card.classList.toggle('running', sw.running);
  startBtn.textContent = sw.running ? 'Pause' : 'Start';
  renderLaps(i);
  saveState();
}

function renderLaps(i) {
  const sw = watches[i];
  const el = document.getElementById(`laps-${i}`);
  const total = sw.laps.length;
  el.innerHTML = sw.laps.slice(-3).reverse()
    .map((ms, k) => `<div>L${total - k} ${fmt(ms)}</div>`).join('');
}

// ─── Save / restore state ─────────────────────────────────────────────────────
const STORAGE_KEY = 'coach-timer-state-v1';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      names: watches.map((_, i) => document.getElementById(`name-${i}`).value),
      watches: watches.map(w => ({
        elapsed: w.elapsed, startedAt: w.startedAt, running: w.running,
        lapCount: w.lapCount, laps: w.laps
      }))
    }));
  } catch (e) { /* storage unavailable */ }
}

function loadState() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!data) return;
    watches.forEach((w, i) => {
      const d = data.watches && data.watches[i];
      if (d) {
        w.elapsed   = d.elapsed || 0;
        w.startedAt = d.running ? d.startedAt : null;
        w.running   = !!(d.running && d.startedAt);
        w.lapCount  = d.lapCount || 0;
        w.laps      = Array.isArray(d.laps) ? d.laps : [];
      }
      document.getElementById(`name-${i}`).value = (data.names && data.names[i]) || '';
      updateCard(i);
    });
    updateMasterBtn();
    updateWakeLock();
  } catch (e) { /* ignore corrupt state */ }
}

// ─── Render loop ──────────────────────────────────────────────────────────────
function renderLoop() {
  watches.forEach((sw, i) => {
    document.getElementById(`time-${i}`).textContent = fmt(sw.getMs());
  });
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

// ─── Wake Lock ────────────────────────────────────────────────────────────────
async function updateWakeLock() {
  const anyRunning = watches.some(w => w.running);
  if (anyRunning && !wakeLock && 'wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      updateStatusBar('⚡ Screen will stay on while timing');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        if (!watches.some(w => w.running)) updateStatusBar('All timers stopped');
      });
    } catch (e) { /* permission denied */ }
  } else if (!anyRunning && wakeLock) {
    wakeLock.release();
    wakeLock = null;
    updateStatusBar('All timers stopped');
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && watches.some(w => w.running)) {
    updateWakeLock();
  }
});

// ─── Status bar ───────────────────────────────────────────────────────────────
function updateStatusBar(msg) {
  document.getElementById('status-bar').textContent = msg;
}

// ─── PWA Install prompt ───────────────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  document.getElementById('install-banner').style.display = 'flex';
});

document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  document.getElementById('install-banner').style.display = 'none';
});

document.getElementById('dismiss-banner').addEventListener('click', () => {
  document.getElementById('install-banner').style.display = 'none';
});

watches.forEach((_, i) => {
  document.getElementById(`name-${i}`).addEventListener('input', saveState);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveState();
});
window.addEventListener('pagehide', saveState);

window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
});

loadState();
</script>
</body>
</html>
